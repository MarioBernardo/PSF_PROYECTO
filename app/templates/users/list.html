{% extends 'base.html' %}

{% block content %}
<h2>Usuarios</h2>

<a href="{{ url_for('users.create_user') }}" class="btn btn-primary mb-3">
    Nuevo Usuario
</a>

<table class="table table-bordered">
    <thead>
        <tr>
            <th>ID</th>
            <th>Usuario</th>
            <th>Correo</th>
            <th>Rol</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for u in usuarios %}
        <tr>
            <td>{{ u.id }}</td>
            <td>{{ u.username }}</td>
            <td>{{ u.email }}</td>
            <td>{{ u.role }}</td>
            <td>
                <a href="{{ url_for('users.edit_user', id=u.id) }}" class="btn btn-warning btn-sm">
                    Editar
                </a>

                <form action="{{ url_for('users.delete_user', id=u.id) }}" method="POST" style="display:inline;">
                    <button type="submit" class="btn btn-danger btn-sm"
                        onclick="return confirm('¿Seguro que deseas eliminar este usuario?')">
                        Eliminar
                    </button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
