{% extends 'base.html' %}

{% block content %}
<h2>Documentos</h2>

<a href="{{ url_for('documents.create_document') }}"
class="btn btn-primary mb-3">
Nuevo Documento
</a>

<table class="table table-bordered table-sm">

<thead>
<tr>
<th>ID</th>
<th>Número</th>
<th>Tipo</th>
<th>Estado</th>
<th>Título</th>
<th>Fecha</th>
<th>Archivo</th>
<th>Acciones</th>
</tr>
</thead>

<tbody>

{% for d in documentos %}
<tr>

<td>{{ d.id }}</td>
<td>{{ d.numero }}</td>
<td>{{ d.tipo }}</td>
<td>{{ d.estado }}</td>
<td>{{ d.titulo }}</td>
<td>{{ d.fecha }}</td>
<td>{{ d.archivo }}</td>

<td>

<a href="{{ url_for('documents.download_document', filename=d.archivo) }}"
class="btn btn-success btn-sm">
Descargar
</a>

<a href="{{ url_for('documents.edit_document', id=d.id) }}"
class="btn btn-warning btn-sm">
Editar
</a>

<form method="POST"
action="{{ url_for('documents.delete_document', id=d.id) }}"
style="display:inline;">

<button class="btn btn-danger btn-sm">
Eliminar
</button>

</form>

</td>

</tr>
{% endfor %}

</tbody>
</table>

{% endblock %}
